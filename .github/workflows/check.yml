name: Check programs
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make test
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Desktop copying and PowerShell syntax
        shell: powershell
        run: .\scripts\check-windows.ps1
